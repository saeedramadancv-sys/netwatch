<!doctype html>
<!--
  lang and dir are defaults that I18nService overwrites at runtime from the stored
  or browser-preferred language. Setting them in the markup avoids a flash of the
  wrong direction before Angular boots.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>NetWatch</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Network and service availability monitoring." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
