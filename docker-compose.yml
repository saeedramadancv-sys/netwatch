name: netwatch

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The API waits for this: starting against a database that is still coming up
      # would fail the startup migration and take the container down with it.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      Database__Provider: SqlServer
      ConnectionStrings__Default: "Server=db,1433;Database=NetWatch;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      # No default is provided for either secret. The application refuses to start
      # without a signing key, which is the intended behaviour: a committed default
      # would be a public credential.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@netwatch.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}

      Monitoring__Enabled: "true"
      Monitoring__MaxConcurrentChecks: "20"
    ports:
      - "8080:8080"
    cap_add:
      # ICMP probes send raw packets. Without this capability they report
      # "not permitted in this environment" and TCP or HTTP probes should be used
      # instead - which is often the better check anyway.
      - NET_RAW
    restart: unless-stopped

volumes:
  mssql-data:
